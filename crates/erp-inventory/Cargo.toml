[package]
name = "erp-inventory"
version = "0.1.0"
edition = "2024"

[dependencies]
rust_decimal = { version = "=1.42.0", features = ["maths", "serde"] }
serde = { version = "1.0", features = ["derive"] }
thiserror = "1.0"
chrono = { version = "0.4", features = ["serde"] }
surrealdb = { version = "3.0.5", features = ["protocol-ws", "rustls"] }
uuid = { version = "1.8", features = ["v4"] }
